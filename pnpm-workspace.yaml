# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# A later project-only session must not mutate a shared-store inode through node_modules.
packageImportMethod: clone-or-copy
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
# Security floors from the 2026-09-24 audit; keep overrides scoped to affected ranges.
overrides:
  miniflare>sharp: 0.35.4
  '@babel/core@<=7.29.0': 7.29.6
  'baseline-browser-mapping@>=2.0.0 <2.11.0': 2.11.0
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'browserslist@<=4.28.6': 4.28.7
  'esbuild@<=0.24.2': 0.25.12
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'image-size@<=2.0.2': 2.0.3
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'react-server-dom-webpack@>=19.2.0 <19.2.8': 19.2.8
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'vite@>=8.0.0 <=8.0.15': 8.0.16
  'ws@>=8.0.0 <8.21.0': 8.21.0
